<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#b000ff" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#b000ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="node-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#b000ff" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 800;
      font-size: 30px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-weight: 500;
      font-size: 15px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #00f3ff;
    }
    .pulse-dot {
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }
  </style>

  <!-- Main Outer Container with Outer Glow -->
  <rect x="5" y="5" width="790" height="230" rx="16" fill="url(#bg-grad)" stroke="url(#card-border)" stroke-width="2"/>

  <!-- Background Cyber Grid Pattern -->
  <g opacity="0.07" stroke="#00f3ff" stroke-width="1">
    <path d="M 0,40 L 800,40 M 0,80 L 800,80 M 0,120 L 800,120 M 0,160 L 800,160 M 0,200 L 800,200" />
    <path d="M 100,0 L 100,240 M 200,0 L 200,240 M 300,0 L 300,240 M 400,0 L 400,240 M 500,0 L 500,240 M 600,0 L 600,240 M 700,0 L 700,240" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="120" r="80" fill="#00f3ff" opacity="0.08" filter="url(#soft-glow)"/>
  <circle cx="680" cy="80" r="90" fill="#b000ff" opacity="0.08" filter="url(#soft-glow)"/>

  <!-- Visual Node Network Diagram (Left Graphic) -->
  <g transform="translate(65, 120)">
    <!-- Network Connections -->
    <line x1="-35" y1="-30" x2="0" y2="0" stroke="#00f3ff" stroke-width="1.5" opacity="0.6" />
    <line x1="-35" y1="30" x2="0" y2="0" stroke="#00ff9d" stroke-width="1.5" opacity="0.6" />
    <line x1="35" y1="-35" x2="0" y2="0" stroke="#b000ff" stroke-width="1.5" opacity="0.6" />
    <line x1="35" y1="35" x2="0" y2="0" stroke="#00f3ff" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="0" x2="45" y2="0" stroke="#ffffff" stroke-width="2" opacity="0.8" />

    <!-- Sub Nodes -->
    <circle cx="-35" cy="-30" r="7" fill="#00f3ff" />
    <circle cx="-35" cy="30" r="7" fill="#00ff9d" />
    <circle cx="35" cy="-35" r="7" fill="#b000ff" />
    <circle cx="35" cy="35" r="7" fill="#00f3ff" />

    <!-- Central Orchestrator Core Node -->
    <circle cx="0" cy="0" r="16" fill="url(#node-gradient)" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Main Header Content -->
  <g transform="translate(160, 0)">
    <!-- Badge / Status Tag -->
    <g transform="translate(0, 38)">
      <rect x="0" y="0" width="185" height="24" rx="12" fill="#00f3ff" fill-opacity="0.1" stroke="#00f3ff" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="14" cy="12" r="4" fill="#00ff9d" filter="url(#glow)"/>
      <text x="26" y="16" class="tag-text">SYSTEM STATUS: AGENTIC</text>
    </g>

    <!-- Title & Gradient Bar -->
    <text x="0" y="94" class="title">NAVIGATING THE LLM LANDSCAPE</text>
    <rect x="0" y="106" width="580" height="3" rx="1.5" fill="url(#primary-glow)" filter="url(#glow)"/>

    <!-- Subtitle -->
    <text x="0" y="133" class="subtitle">Autonomous Agent Architect • Swarm Orchestrator • Model Context Protocol</text>

    <!-- Tech Chips / Capability Tags -->
    <g transform="translate(0, 155)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🤖 Multi-Agent Swarms</text>

      <!-- Chip 2 -->
      <rect x="135" y="0" width="125" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="147" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#c084fc">🧠 Deep Reasoning</text>

      <!-- Chip 3 -->
      <rect x="270" y="0" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="282" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#4ade80">🔌 MCP &amp; Tool Use</text>

      <!-- Chip 4 -->
      <rect x="395" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="407" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#facc15">⚡ RAG &amp; Vector DBs</text>
    </g>
  </g>
</svg>
